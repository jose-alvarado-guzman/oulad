[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oulad"
version = "0.1.0"
description = "Load the OULAD dataset into Neo4j as a property graph"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pyneoinstance>=4.0.3,<5",
    "pandas>=3.0,<4",
    "python-dotenv>=1.2,<2",
    "PyYAML>=6.0,<7",
    "neo4j>=6.2,<7",
    # Not imported here. pyneoinstance pulls in neo4j-viz, whose widget module
    # evaluates traitlets.Instance[...] at import time, and that only became
    # subscriptable in traitlets 5.10. neo4j-viz asks for traitlets>=5,<6, so an
    # environment already holding 5.7 keeps it and importing pyneoinstance fails
    # with "type 'Instance' is not subscriptable". Colab pins exactly 5.7.1.
    "traitlets>=5.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is not installed by default, so put src on the path for tests.
pythonpath = ["src"]
addopts = "-q"
markers = [
    "requires_data: needs the gitignored Data/ directory to be populated",
]

[project.scripts]
oulad-load = "oulad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
# Only the package ships. Namespace discovery is on by default here, so any
# other directory added under src/ would otherwise be picked up too.
include = ["oulad*"]

# Install with `pip install -e .` rather than a plain `pip install .`. The
# pipeline locates config.yaml, Data/, Logs/ and Result/ relative to the
# package directory, which only resolves to the repository root while the
# install points back at this checkout.
