<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-label="Early-warning timeline: day 7 silence, days 31 to 75 missed assessments, day 90 sequence model, then an unseen module">
<rect width="920" height="300" rx="8" fill="#1a1a19"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<line x1="50.0" y1="150" x2="770.0" y2="150" stroke="#5a5955" stroke-width="2" stroke-linecap="round"/>
<line x1="50.0" y1="146" x2="50.0" y2="154" stroke="#5a5955" stroke-width="2"/>
<text x="50.0" y="172" text-anchor="middle" font-size="12" fill="#c3c2b7">day 0</text>
<line x1="266.0" y1="146" x2="266.0" y2="154" stroke="#5a5955" stroke-width="2"/>
<text x="266.0" y="172" text-anchor="middle" font-size="12" fill="#c3c2b7">day 30</text>
<line x1="482.0" y1="146" x2="482.0" y2="154" stroke="#5a5955" stroke-width="2"/>
<text x="482.0" y="172" text-anchor="middle" font-size="12" fill="#c3c2b7">day 60</text>
<line x1="698.0" y1="146" x2="698.0" y2="154" stroke="#5a5955" stroke-width="2"/>
<text x="698.0" y="172" text-anchor="middle" font-size="12" fill="#c3c2b7">day 90</text>
<text x="792.0" y="155" text-anchor="middle" font-size="16" fill="#c3c2b7">//</text>
<rect x="273.20000000000005" y="145" width="316.79999999999995" height="10" rx="4" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="100.4" cy="150" r="8" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="698.0" cy="150" r="8" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<circle cx="850" cy="150" r="8" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<line x1="100.4" y1="150" x2="100.4" y2="84" stroke="#5a5955" stroke-width="1"/>
<text x="94.4" y="36" text-anchor="start" font-size="15" font-weight="600" fill="#ffffff">Day 7 · still silent</text>
<text x="94.4" y="55" text-anchor="start" font-size="14" font-weight="400" fill="#ffffff">74% fail or withdraw</text>
<text x="94.4" y="74" text-anchor="start" font-size="14" font-weight="400" fill="#c3c2b7">against a 47% base rate</text>
<line x1="431.6" y1="150" x2="431.6" y2="214" stroke="#5a5955" stroke-width="1"/>
<text x="431.6" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Days 31–75 · no assessment handed in</text>
<text x="431.6" y="253" text-anchor="middle" font-size="14" font-weight="400" fill="#ffffff">74–93% precision</text>
<text x="431.6" y="272" text-anchor="middle" font-size="14" font-weight="400" fill="#c3c2b7">in all seven modules</text>
<line x1="698.0" y1="150" x2="698.0" y2="84" stroke="#5a5955" stroke-width="1"/>
<text x="704.0" y="36" text-anchor="end" font-size="15" font-weight="600" fill="#ffffff">Day 90 · sequence model</text>
<text x="704.0" y="55" text-anchor="end" font-size="14" font-weight="400" fill="#ffffff">83–86% precision</text>
<text x="704.0" y="74" text-anchor="end" font-size="14" font-weight="400" fill="#c3c2b7">on held-out students</text>
<line x1="850" y1="150" x2="850" y2="214" stroke="#5a5955" stroke-width="1"/>
<text x="900" y="234" text-anchor="end" font-size="15" font-weight="600" fill="#ffffff">A module never trained on</text>
<text x="900" y="253" text-anchor="end" font-size="14" font-weight="400" fill="#ffffff">96 of its top 100 correct</text>
<text x="900" y="272" text-anchor="end" font-size="14" font-weight="400" fill="#c3c2b7">against a 27% base rate</text>
</g></svg>
